name: Tutorial
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install the Holon CLI
        env:
          VERSION: 0.0.1-dev.44
          SHA256: d3ca0c5a4cc5f8b510f9f67fa987853fec78f51e42103e4a539602f758e9ce3b
        run: |
          archive="$RUNNER_TEMP/holon.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/holon-sh/cli/releases/download/v$VERSION/holon_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --quiet
          mkdir "$RUNNER_TEMP/holon"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/holon" holon
          echo "$RUNNER_TEMP/holon" >> "$GITHUB_PATH"
      - run: |
          npm install --prefix chat
          holon types generate
          holon check
          npm run build --prefix chat
        working-directory: typescript
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ./chat mypy==2.4.0
          npm install --prefix chat
          holon types generate
          holon check
          npm run build --prefix chat
        working-directory: python
